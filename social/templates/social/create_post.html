{% extends 'base.html' %}

{% block title %}
    Create a New Post
{% endblock %}

{% block content %}
    <div class="container mt-5">
        <h2>Create a New Post</h2>

        <form method="POST" enctype="multipart/form-data">
            {% csrf_token %}
            {{ form.as_p }}
            <button type="submit" class="btn btn-primary">Create Post</button>
        </form>
    </div>
{% endblock %}
